name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Requires a runner image with the v145 platform toolset (Visual Studio 2026+)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content .version -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([-+].+)?$') {
            throw "Invalid .version '$version' (expected semver, e.g. 1.0.0)"
          }
          "value=$version" | Add-Content -Path $env:GITHUB_OUTPUT
          "tag=v$version" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Check whether the version tag already exists
        id: check
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          if (git tag --list $env:TAG) {
            Write-Host "Tag $env:TAG already exists, skipping release"
            "exists=true" | Add-Content -Path $env:GITHUB_OUTPUT
          } else {
            Write-Host "Tag $env:TAG is new"
            "exists=false" | Add-Content -Path $env:GITHUB_OUTPUT
          }

      - name: Setup MSBuild
        if: steps.check.outputs.exists == 'false'
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        if: steps.check.outputs.exists == 'false'
        run: msbuild nrmm.vcxproj /m /p:Configuration=Release /p:Platform=x64

      - name: Package release
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/nrmm.dll dist/
          if (Test-Path bin/nrmm.pdb) { Copy-Item bin/nrmm.pdb dist/ }
          Compress-Archive -Path dist/* -DestinationPath "dist/nrmm-$env:TAG.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NRMM ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/nrmm-${{ steps.version.outputs.tag }}.zip
            bin/nrmm.dll
            bin/nrmm.pdb
